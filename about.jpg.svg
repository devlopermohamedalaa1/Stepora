<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-label="Stepora sneaker illustration" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf0ee"/>
      <stop offset="1" stop-color="#f3d9d5"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2d42"/>
      <stop offset="1" stop-color="#3d405b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" rx="24" fill="url(#bg)"/>
  <circle cx="470" cy="110" r="150" fill="#e63946" opacity="0.08"/>
  <circle cx="110" cy="360" r="110" fill="#e63946" opacity="0.06"/>
  <text x="300" y="95" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700" letter-spacing="10" fill="#e63946" opacity="0.18">STEPORA</text>

  <!-- Ground shadow -->
  <ellipse cx="300" cy="362" rx="235" ry="14" fill="#000" opacity="0.12"/>

  <!-- Shoe body -->
  <path d="M110 300 C105 240 110 190 135 165 C160 150 210 150 235 160 L270 200 C320 230 400 240 450 265 C490 280 505 295 505 300 Z" fill="url(#body)"/>

  <!-- Toe cap -->
  <path d="M440 262 C480 276 502 290 505 300 L410 300 C415 285 425 270 440 262 Z" fill="#f1f1f1"/>

  <!-- Tongue -->
  <path d="M235 160 L255 118 C265 108 288 116 288 134 L272 202 Z" fill="#e63946"/>

  <!-- Side stripe -->
  <path d="M150 282 C220 272 300 252 385 240" fill="none" stroke="#e63946" stroke-width="10" stroke-linecap="round"/>

  <!-- Laces -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="270" y1="190" x2="300" y2="176"/>
    <line x1="298" y1="208" x2="330" y2="192"/>
    <line x1="328" y1="224" x2="360" y2="208"/>
    <line x1="360" y1="236" x2="392" y2="220"/>
  </g>

  <!-- Heel tab -->
  <path d="M110 300 C105 255 108 215 122 190 L140 190 C130 220 130 260 138 300 Z" fill="#e63946" opacity="0.9"/>

  <!-- Sole -->
  <path d="M95 300 L510 300 L510 318 C510 332 495 342 478 342 L125 342 C105 342 95 332 95 318 Z" fill="#ffffff" stroke="#d9d9d9" stroke-width="2"/>
  <path d="M105 322 L500 322" stroke="#e63946" stroke-width="5" stroke-linecap="round"/>
